# LAN-only HTTPS reverse proxy (self-signed). Do not expose to the public Internet.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eigeneai.local _;

    ssl_certificate     /etc/eigeneai/ssl/cert.pem;
    ssl_certificate_key /etc/eigeneai/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Optional: restrict to LAN subnets (anpassen)
    # allow 192.168.0.0/16;
    # allow 10.0.0.0/8;
    # deny all;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}
